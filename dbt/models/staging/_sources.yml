sources:
  - name: raw
    description: >
      Raw Parquet written by ingestion (all columns text, raw CFPB names): the bulk file
      (ingestion.bulk) and the API day pulls (ingestion.incremental).
    tables:
      - name: complaints
        meta:
          external_location: "read_parquet('{{ env_var('CFPB_RAW_PARQUET') }}')"
        columns:
          - name: '"Timely response?"'
            quote: false
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["Yes", "No"]
          - name: '"Tags"'
            quote: false
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["Older American", "Servicemember", "Older American, Servicemember"]
      - name: api_complaints
        description: API day exports, normalized to the bulk representation, plus pulled_at.
        meta:
          external_location: "read_parquet('{{ env_var('CFPB_API_PARQUET') }}')"
      - name: api_pull_days
        description: One row per (pull, received day) the pull covered, including empty days.
        meta:
          external_location: "read_parquet('{{ env_var('CFPB_API_PULL_DAYS') }}')"
