# Governed metrics: defined here only (AGENTS.md). Definitions follow PRD §7 and the M3 plan
# (decision log). Reference SQL for each: tests/test_metric_reference.py.
# Rates are ratios of 0/1 sums; their denominators state what is excluded (counted in coverage).
semantic_models:
  - name: complaints
    description: One row per complaint (fct_complaints).
    model: ref('fct_complaints')
    defaults:
      agg_time_dimension: date_received
    entities:
      - name: complaint
        type: primary
        expr: complaint_id
      - name: company_product
        type: foreign
        expr: company_product_key
    dimensions:
      - name: date_received
        type: time
        type_params:
          time_granularity: day
      - name: company
        type: categorical
      - name: product
        type: categorical
      - name: product_family
        type: categorical
    measures:
      - name: complaints
        description: Count of complaints.
        agg: count
        expr: complaint_id
      - name: relief_complaints
        description: Closed with relief (monetary, non-monetary, or 2011-12 'with relief').
        agg: sum
        expr: "case when is_relief then 1 else 0 end"
      - name: relief_known_complaints
        description: Closed with a recorded outcome (excludes open, bare 'Closed', missing).
        agg: sum
        expr: "case when is_relief is not null then 1 else 0 end"
      - name: monetary_relief_complaints
        agg: sum
        expr: "case when is_monetary_relief then 1 else 0 end"
      - name: monetary_known_complaints
        description: Closed with a recorded relief kind (also excludes 2011-12 'with relief').
        agg: sum
        expr: "case when is_monetary_relief is not null then 1 else 0 end"
      - name: responded_complaints
        description: Company responded (status known and not In progress; untimely counts).
        agg: sum
        expr: "case when company_response is not null and company_response <> 'In progress' then 1 else 0 end"
      - name: timely_responded_complaints
        agg: sum
        expr: "case when timely and company_response is not null and company_response <> 'In progress' then 1 else 0 end"
      - name: public_response_known_complaints
        description: Public response known (from 2015; closed or untimely).
        agg: sum
        expr: "case when public_response is not null then 1 else 0 end"
      - name: substantive_public_response_complaints
        description: A public response other than none given or the boilerplate opt-out.
        agg: sum
        expr: "case when public_response is not null and public_response not in ('none_given', 'Company chooses not to provide a public response') then 1 else 0 end"
      - name: forwarding_lag_median
        description: Median days from received to sent to company (the -1 artifact kept).
        agg: median
        expr: forwarding_lag_days
      # BEGIN GENERATED credit card issue measures (uv run python -m core.issue_share)
      - name: credit_card_issue_known_complaints
        description: Credit card complaints with a known issue (null issue excluded).
        agg: sum
        expr: "case when credit_card_issue is not null then 1 else 0 end"
      - name: cc_issue_advertising_and_marketing_including_promotional_offers
        agg: sum
        expr: "case when credit_card_issue = 'Advertising and marketing, including promotional offers' then 1 else 0 end"
      - name: cc_issue_closing_your_account
        agg: sum
        expr: "case when credit_card_issue = 'Closing your account' then 1 else 0 end"
      - name: cc_issue_credit_monitoring_or_identity_theft_protection_services
        agg: sum
        expr: "case when credit_card_issue = 'Credit monitoring or identity theft protection services' then 1 else 0 end"
      - name: cc_issue_fees_or_interest
        agg: sum
        expr: "case when credit_card_issue = 'Fees or interest' then 1 else 0 end"
      - name: cc_issue_fraud_or_identity_theft_pre_2017_label
        agg: sum
        expr: "case when credit_card_issue = 'Fraud or identity theft (pre-2017 label)' then 1 else 0 end"
      - name: cc_issue_getting_a_credit_card
        agg: sum
        expr: "case when credit_card_issue = 'Getting a credit card' then 1 else 0 end"
      - name: cc_issue_improper_use_of_your_report
        agg: sum
        expr: "case when credit_card_issue = 'Improper use of your report' then 1 else 0 end"
      - name: cc_issue_incorrect_information_on_your_report
        agg: sum
        expr: "case when credit_card_issue = 'Incorrect information on your report' then 1 else 0 end"
      - name: cc_issue_other_features_terms_or_problems
        agg: sum
        expr: "case when credit_card_issue = 'Other features, terms, or problems' then 1 else 0 end"
      - name: cc_issue_problem_when_making_payments
        agg: sum
        expr: "case when credit_card_issue = 'Problem when making payments' then 1 else 0 end"
      - name: cc_issue_problem_with_a_company_s_investigation_into_an_existing_problem
        agg: sum
        expr: "case when credit_card_issue = 'Problem with a company''s investigation into an existing problem' then 1 else 0 end"
      - name: cc_issue_problem_with_a_purchase_shown_on_your_statement
        agg: sum
        expr: "case when credit_card_issue = 'Problem with a purchase shown on your statement' then 1 else 0 end"
      - name: cc_issue_problem_with_fraud_alerts_or_security_freezes
        agg: sum
        expr: "case when credit_card_issue = 'Problem with fraud alerts or security freezes' then 1 else 0 end"
      - name: cc_issue_struggling_to_pay_your_bill
        agg: sum
        expr: "case when credit_card_issue = 'Struggling to pay your bill' then 1 else 0 end"
      - name: cc_issue_trouble_using_your_card
        agg: sum
        expr: "case when credit_card_issue = 'Trouble using your card' then 1 else 0 end"
      - name: cc_issue_unable_to_get_your_credit_report_or_credit_score
        agg: sum
        expr: "case when credit_card_issue = 'Unable to get your credit report or credit score' then 1 else 0 end"
      # END GENERATED credit card issue measures

metrics:
  - name: complaint_count
    label: Complaint count
    description: >-
      Count of complaints (PRD §7). Counts are not rates; no size denominator.
      Periods with no complaints are 0 (joined to the time spine), not missing.
    type: simple
    type_params:
      measure:
        name: complaints
        fill_nulls_with: 0
        join_to_timespine: true

  # numerators and denominators: governed counts in their own right
  - {name: relief_count, label: Closed with relief, type: simple, type_params: {measure: relief_complaints}}
  - {name: relief_known_count, label: Closed with a recorded outcome, type: simple, type_params: {measure: relief_known_complaints}}
  - {name: monetary_relief_count, label: Closed with monetary relief, type: simple, type_params: {measure: monetary_relief_complaints}}
  - {name: monetary_known_count, label: Closed with a recorded relief kind, type: simple, type_params: {measure: monetary_known_complaints}}
  - {name: responded_count, label: Complaints with a company response, type: simple, type_params: {measure: responded_complaints}}
  - {name: timely_responded_count, label: Timely company responses, type: simple, type_params: {measure: timely_responded_complaints}}
  - {name: public_response_known_count, label: Complaints with a known public response, type: simple, type_params: {measure: public_response_known_complaints}}
  - {name: substantive_public_response_count, label: Substantive public responses, type: simple, type_params: {measure: substantive_public_response_complaints}}

  - name: relief_rate
    label: Relief rate
    description: >-
      Closed with monetary or non-monetary relief / closed complaints with a recorded outcome.
      Excludes open complaints (In progress, Untimely), bare 'Closed' (2011-17, outcome not
      recorded) and status missing.
    type: ratio
    type_params: {numerator: relief_count, denominator: relief_known_count}
  - name: monetary_relief_rate
    label: Monetary relief rate
    description: >-
      Closed with monetary relief / closed complaints with a recorded relief kind. Also excludes
      2011-12 'Closed with relief' (kind not recorded), never guessed.
    type: ratio
    type_params: {numerator: monetary_relief_count, denominator: monetary_known_count}
  - name: timely_response_rate
    label: Timely response rate
    description: >-
      Timely responses / complaints the company responded to (Untimely response counts as a
      response). Excludes In progress (always marked timely before a response) and status missing.
    type: ratio
    type_params: {numerator: timely_responded_count, denominator: responded_count}
  - name: public_response_rate
    label: Substantive public response rate
    description: >-
      Complaints with a substantive company public response / complaints whose public response
      is known. 'None given' and the boilerplate 'chooses not to provide a public response' are
      not substantive. Excludes pre-2015 (option did not exist), In progress, status missing.
    type: ratio
    type_params: {numerator: substantive_public_response_count, denominator: public_response_known_count}
  - name: forwarding_lag_days
    label: Median forwarding lag (days)
    description: >-
      Median of date sent to company minus date received. The -1 day artifact (7,050 complaints,
      likely a timezone effect) is kept as recorded (nulls.md).
    type: simple
    type_params: {measure: forwarding_lag_median}

  # Period-to-date counts: complaints from the start of the month / quarter / year through
  # each day; at a coarser grain, the value on the period's last day with data.
  - name: complaint_count_mtd
    label: Complaints month to date
    description: Complaints from the 1st of the month through the day (last day with data).
    type: cumulative
    type_params:
      measure: complaints
      cumulative_type_params: {grain_to_date: month, period_agg: last}
  - name: complaint_count_qtd
    label: Complaints quarter to date
    description: Complaints from the start of the quarter through the day (last day with data).
    type: cumulative
    type_params:
      measure: complaints
      cumulative_type_params: {grain_to_date: quarter, period_agg: last}
  - name: complaint_count_ytd
    label: Complaints year to date
    description: Complaints from 1 January through the day (last day with data).
    type: cumulative
    type_params:
      measure: complaints
      cumulative_type_params: {grain_to_date: year, period_agg: last}

  # Growth compares like for like: the same days of the earlier period (period to date), so a
  # partial last period (data ending mid-month, or a year so far) is compared with the same
  # span a month / year earlier. query_metric flags such periods in provenance.partial_periods.
  - name: complaint_growth_mom
    label: Complaint growth, month over month
    description: >-
      Complaints this month (to the last day with data) vs the same days of the month before,
      as (current - earlier) / earlier; null when the earlier span had none. Group by
      metric_time__month. Partial months are compared like for like and flagged.
    type: derived
    type_params:
      expr: (month_to_date - previous_month_to_date) / nullif(previous_month_to_date, 0)
      metrics:
        - {name: complaint_count_mtd, alias: month_to_date}
        - {name: complaint_count_mtd, alias: previous_month_to_date, offset_window: 1 month}
  - name: complaint_growth_yoy
    label: Complaint growth, year over year (monthly)
    description: >-
      Complaints this month vs the same days of the same month a year earlier; removes
      seasonality. Group by metric_time__month. Partial months compared like for like, flagged.
    type: derived
    type_params:
      expr: (month_to_date - year_earlier) / nullif(year_earlier, 0)
      metrics:
        - {name: complaint_count_mtd, alias: month_to_date}
        - {name: complaint_count_mtd, alias: year_earlier, offset_window: 1 year}
  - name: complaint_growth_yoy_quarterly
    label: Complaint growth, year over year (quarterly)
    description: >-
      Complaints this quarter vs the same days of the quarter a year earlier. Group by
      metric_time__quarter. Partial quarters compared like for like, flagged.
    type: derived
    type_params:
      expr: (quarter_to_date - year_earlier) / nullif(year_earlier, 0)
      metrics:
        - {name: complaint_count_qtd, alias: quarter_to_date}
        - {name: complaint_count_qtd, alias: year_earlier, offset_window: 1 year}
  - name: complaint_growth_yoy_annual
    label: Complaint growth, year over year (annual)
    description: >-
      Complaints this year vs the same days of the year before (e.g. 2026 so far vs the same
      days of 2025). Group by metric_time__year. Partial years compared like for like, flagged.
    type: derived
    type_params:
      expr: (year_to_date - year_earlier) / nullif(year_earlier, 0)
      metrics:
        - {name: complaint_count_ytd, alias: year_to_date}
        - {name: complaint_count_ytd, alias: year_earlier, offset_window: 1 year}
