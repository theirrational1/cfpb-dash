[[cases]]
id = "e1-001"
question = "How many complaints did CITIBANK, N.A. receive in March 2026?"
ground_truth_sql = """
SELECT count(*)
FROM stg_complaints
WHERE company = 'CITIBANK, N.A.'
  AND date_received >= DATE '2026-03-01'
  AND date_received < DATE '2026-04-01'
"""
