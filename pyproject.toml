[project]
name = "cfpb-dash"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "prek>=0.5.9",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not data'"
markers = [
    "data: needs real files in data/ (slow; skipped by default and in CI). Run with: uv run pytest -m data",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["local_llm", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
exclude = ["local_llm"]
